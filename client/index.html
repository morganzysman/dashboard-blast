<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast · Smash Burgers</title>

    <!-- Cache Control - Prevent Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- PWA Meta Tags -->
    <meta name="description" content="Panel de operación de Blast Smash Burgers — Miraflores · Barranco, Lima, Perú.">
    <meta name="theme-color" content="#075A2A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blast">
    <meta name="msapplication-TileColor" content="#075A2A">
    <meta name="msapplication-config" content="/browserconfig.xml">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#075A2A">

    <!-- Fonts — Anton (titulares) · Quicksand (cuerpo) · Space Mono (datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Iconography: Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..500,0..1,0" />

    <!-- Preload service worker -->
    <link rel="preload" href="/sw.js" as="script">

    <!-- Theme init (avoid FOUC): set [data-theme] before first paint -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <style>
      /* Splash screen — Fondo Crema, loseta cerámica, spinner menta. */
      #blast-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFF8E7;
      }
      #blast-splash .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 40px 48px;
        background: #FFFFFF;
        border: 1px solid #EEEEEE;
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(7, 90, 42, .06);
      }
      #blast-splash .mark {
        width: 56px;
        height: 56px;
        color: #075A2A;
      }
      #blast-splash .bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: #EEEEEE;
        overflow: hidden;
      }
      #blast-splash .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #50C293;
        animation: blast-sweep 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      #blast-splash .note {
        margin: 0;
        font-family: 'Space Mono', ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #5C6B62;
      }
      @keyframes blast-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      [data-theme="dark"] #blast-splash { background: #032313; }
      [data-theme="dark"] #blast-splash .tile { background: #063D1F; border-color: rgba(255,248,231,.13); }
      [data-theme="dark"] #blast-splash .mark { color: #50C293; }
      [data-theme="dark"] #blast-splash .bar { background: rgba(255,248,231,.13); }
      [data-theme="dark"] #blast-splash .note { color: #A6C9B4; }
    </style>
</head>
<body class="font-sans">
    <div id="app" class="min-h-screen">
        <!-- Vue.js app will mount here -->
        <div id="blast-splash">

                <div class="bar"><span></span></div>
                <p class="note">Cargando</p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
